shell = "zsh -c '{}'"
default-scheme = "base16-tender"
default-cycle-ring = "default"

[[rings]]
name = "default"
schemes = ["base16-woodland", "base16-gruvbox-dark-medium", "base16-github"]

[[rings]]
name = "cool"
schemes = ["base16-woodland", "base24-one-black", "base24-earthsong", "base16-gruvbox-dark-medium", "base16-github"]

[[rings]]
name = "base"
schemes = ["base16-mocha", "base16-gruvbox-dark"]

[[rings]]
name = "light"
schemes = ["base16-gruvbox-light", "base16-github"]

[[items]]
path = "https://github.com/tinted-theming/tinted-shell"
name = "tinted-shell"
hook = ". %f"
themes-dir = "scripts"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/base16-tmux"
name = "base16-tmux"
themes-dir = "colors"
hook = "test -n \"$TMUX\" && tmux source-file %f"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/base16-fzf"
name = "fzf"
themes-dir = "bash"
hook = ". %f"
supported-systems = ["base16", "base24"]

[[items]]
path = "https://github.com/tinted-theming/base16-waybar"
name = "base16-waybar"
themes-dir = "colors"
hook = "if ! diff -q %f ~/.config/waybar/colors.css > /dev/null 2>&1; then cp -r %f ~/.config/waybar/colors.css; fi"

[[items]]
path = "https://github.com/tinted-theming/base16-dunst"
name = "base16-dunst"
themes-dir = "themes"
hook = "cp -f %f ~/.config/dunst/dunstrc && systemctl --user restart dunst"

[[items]]
path = "https://github.com/tinted-theming/base16-rofi"
name = "tinted-rofi"
themes-dir = "colors"
hook = "cp -f %f ~/.config/rofi/base16-theme.rasi"

[[items]]
path = "https://github.com/rkubosz/base16-sway"
name = "base16-sway"
revision = "master"
themes-dir = "themes"
hook = "if ! diff -q %f ~/.config/sway/colors > /dev/null 2>&1; then cat %f > ~/.config/sway/colors && swaymsg reload; fi"

[[items]]
name = "tinted-alacritty"
path = "https://github.com/tinted-theming/tinted-alacritty"
themes-dir = "colors"
theme-file-extension = ".toml"
supported-systems = ["base16", "base24"]
hook = "cp -f %f ~/.config/alacritty/colors.toml"

[[items]]
name = "base16-vim"
path = "https://github.com/tinted-theming/base16-vim"
themes-dir = "colors"
supported-systems = ["base16", "base24"]

[[items]]
name = "tinted-claude-code"
path = "https://github.com/tinted-theming/tinted-claude-code"
themes-dir = "themes"
theme-file-extension = ".json"
supported-systems = ["base16", "base24", "tinted8"]
hook = "mkdir -p \"$HOME/.claude/themes\" && cp -f \"$TINTY_THEME_FILE_PATH\" \"$HOME/.claude/themes/tinty.json\""
